version: '3.8'

services:
  backend:
    build: ./backend
    container_name: fleet-fuel-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:8080
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: fleet-fuel-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
